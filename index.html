<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>📝 Создать карточку</h1>

        <form id="cardForm">
            <div class="form-group">
                <label for="title">Заголовок</label>
                <input type="text" id="title" placeholder="Введите заголовок" required>
            </div>

            <div class="form-group">
                <label for="source">Источник</label>
                <input type="text" id="source" placeholder="Введите источник" required>
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" rows="4" placeholder="Введите описание" required></textarea>
            </div>

            <button type="submit" class="btn-primary">Создать карточку</button>
        </form>

        <div id="result" class="result hidden">
            <h2>📄 Готовая карточка</h2>
            <div id="card" class="card"></div>
            <button id="copyBtn" class="btn-secondary">📋 Копировать</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
